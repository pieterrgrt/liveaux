{% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="field{% if field.errors %} field-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="optional">optional</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
  </div>
{% endfor %}

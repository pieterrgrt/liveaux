{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}liveaux — live in Berlin{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'events/style.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="{% url 'events:event_list' %}">liveaux<span>.</span></a>
    <p class="tagline">Live music in Berlin</p>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>liveaux · Berlin</p>
  </footer>
</body>
</html>

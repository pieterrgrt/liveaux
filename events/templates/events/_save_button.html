{% if user.is_authenticated %}
  <form method="post" action="{% url 'events:toggle_save' event.pk %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="button {% if is_saved %}button-ghost{% endif %}">{% if is_saved %}Saved ✓{% else %}Save{% endif %}</button>
  </form>
{% else %}
  <a class="button button-ghost" href="{% url 'account_login' %}?next={{ request.get_full_path|urlencode }}">Log in to save</a>
{% endif %}
